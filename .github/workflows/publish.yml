# tag 推送（v*）→ 全量测试 + 版本号一致性 + 发布 npm + 建 GitHub Release。
# 认证走 npm Trusted Publishing（OIDC，无令牌）：npmjs.com 包设置里登记可信发布者
# kyomio/zcode-executor + 本文件名 publish.yml，此外零配置。
name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 最后一步用 GITHUB_TOKEN 建 Release
      id-token: write # OIDC：Trusted Publishing 认证 + provenance 签名
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines 是 >=22；发布用 24 是因为 Trusted Publishing 要 npm >= 11.5，Node 24 自带。
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 零依赖，没有 install 一步。npm test 里含 sync-doc-version --check：
      # README 徽章和两份插件清单的版本号落后于 package.json 就在这里挂掉。
      - run: npm run test:ci

      # tag 名与 package.json 版本一致（v0.1.0 ↔ "version": "0.1.0"）。
      - run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json $pkg" >&2
            exit 1
          fi

      - run: npm publish

      # Release 排在 npm 之后：它宣告的是「这个版本已经发出去了」，npm 失败就不该留下 Release。
      # --generate-notes 按上一个 tag 以来的提交自动写说明，提交信息就是 changelog。
      # 先 view 再 create：重跑失败的 workflow 时 Release 可能已存在，查到就跳过。
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME 已存在，跳过"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
